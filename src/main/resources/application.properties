spring.application.name=UrbanScientistAI-Telangana
server.port=${PORT:8081}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urbanscientist_telangana?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.serialization.indent-output=true

# Multipart Upload Limits (support large datasets like city_day.csv)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
